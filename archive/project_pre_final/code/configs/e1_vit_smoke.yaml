# E1 ViT brain-only student. CAPPED smoke to verify the full training loop
# (dataset -> Qwen3-VL forward -> loss -> backward -> eval) on GPU before the
# full 8-epoch run. Same schema as e1_vit_direct_qwen3vl4b.yaml, only capped.
run: {name: e1_vit_smoke}
encoder:
  {type: vit, hf_model: google/vit-base-patch16-224, grid: 22, adapt: lora,
   lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05}}
projector: {type: mlp, n_tokens: 16}
backbone:
  {type: qwen, hf_model: Qwen/Qwen3-VL-4B-Instruct, dtype: bfloat16, frozen: true,
   lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05, target_modules: [q_proj, v_proj]}}
modalities: {brain: true, video: false, caption: false}
data: {brain_source: roi_mean}
loss: {hard_kind: mse, lambda_hard: 1.0}
train:
  {device: cuda, seed: 0, epochs: 1, batch_size: 8, lr: 1.0e-4, weight_decay: 0.01,
   max_train_batches: 3, max_eval_batches: 2,
   out_json: project/output/e1_vit_smoke.json}
