run: {name: e2_brain_jepa_teacher}
encoder: {type: bfm, model: brain_jepa, adapt: frozen, emb_dim: 768}
projector: {type: mlp, n_tokens: 16}
video:
  {dim: 1408, type: mlp, n_tokens: 16,
   path: project/shared/data/stimulus_features/vjepa2_pretrained.npy}
backbone:
  {type: qwen, hf_model: Qwen/Qwen3-VL-4B-Instruct, dtype: bfloat16, frozen: true,
   lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05, target_modules: [q_proj, v_proj]}}
modalities: {brain: true, video: true, caption: true}
data: {brain_source: brain_jepa_pretrained_native_mean, caption_source: mindcaptioning_human}
loss: {hard_kind: mse, lambda_hard: 1.0}
train:
  {device: cuda, seed: 0, epochs: 8, batch_size: 8, lr: 1.0e-4,
   weight_decay: 0.01,
   teacher_ckpt: project/output/checkpoints/e2_brain_jepa_teacher_qwen3vl4b.pt,
   out_json: project/output/e2_brain_jepa_teacher_qwen3vl4b.json}
