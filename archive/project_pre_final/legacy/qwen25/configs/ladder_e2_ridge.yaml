# E2. Frozen ridge encoder (ROI 450 -> 34D ridge latent) -> projector -> Qwen -> 34D.
encoder: {name: ridge_latent, weights_path: project/shared/data/ridge_encoder.pt}
projector: {name: mlp, n_tokens: 8}
backbone:
  name: qwen
  hf_model: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05, target_modules: [q_proj, v_proj]}
head: {name: linear34}
modalities: {brain: true, video: false, caption: false}
data: {fmri_mode: mean, brain_source: roi_mean}
train:
  device: cuda
  seed: 0
  epochs: 3
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 0.01
  max_train_batches: null
  max_eval_batches: null
  log_every: 100
  out_json: project/output/ladder_e2_ridge.json
