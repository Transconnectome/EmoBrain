# 서버마다 다른 위치. 이 파일을 configs/paths.yaml로 복사해 고친다(configs/paths.yaml은 git에 올리지 않는다).
# data_root 아래에 원자료가 있어야 한다: Horikawa/sub-XX/v3_qc/, MindCaptioning/sub-XX/v2_qc/, atlas_sources/, Horikawa_embedding/
data_root: /path/to/data_root
# 큰 산출물(특징, 학습 결과, 로그)을 쓰는 곳
output_root: /path/to/outputs
# h264 복호기가 있는 ffmpeg, ffprobe (S3 특징 추출)
ffmpeg: /usr/bin/ffmpeg
ffprobe: /usr/bin/ffprobe
# pymoten 소스 폴더 (S3 저수준 특징)
pymoten_dir: /path/to/pymoten
