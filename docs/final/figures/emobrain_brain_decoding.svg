    <text x="904" y="183" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#415C68">Pair intact head features with the</text>
    <text x="904" y="209" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#415C68">corresponding human rating. Freeze this fit.</text>
