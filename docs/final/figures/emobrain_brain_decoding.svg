  <title id="title">Can fMRI recover the same features and predict emotion ratings?</title>
  <desc id="desc">The feature ridge and emotion readout are fitted on separate inputs and frozen at test time.</desc>
  <rect x="0" y="0" width="1440" height="630" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1" />
  <text x="38" y="56" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#183646">Can fMRI recover the same features and predict emotion ratings?</text>
  <text x="39" y="90" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#415C68">One participant and one emotion are shown. Repeat the readout for all 27 emotions.</text>
