# ============================================================================
# UMBRELLA dataset defs — Horikawa Emotion Cat34 Full Regression (ROI_fMRI)
#
# Task. fMRI → 34 Cowen emotion 각자의 continuous crowdsourced score 예측.
# Training stimuli = 전체 2185.
# Output 형식.
#   <Cat34_Full_Regression_Analysis>
#     <Admiration>0.052</Admiration>
#     <Adoration>0.023</Adoration>
#     ... (34 줄)
#     <Triumph>0.018</Triumph>
#   </Cat34_Full_Regression_Analysis>
# ============================================================================

variable_order: [cat34_full_regression]

variable_registry:
  cat34_full_regression:
    kind: compound
    block: Cat34_Full_Regression_Analysis
    unit: "Cowen & Keltner (2017) 34 emotion, each continuous crowdsourced score (rater proportion, 0-1)"
    facets:
      - {key: admiration,              options: [], fmt: "float:3"}
      - {key: adoration,               options: [], fmt: "float:3"}
      - {key: aesthetic_appreciation,  options: [], fmt: "float:3"}
      - {key: amusement,               options: [], fmt: "float:3"}
      - {key: anger,                   options: [], fmt: "float:3"}
      - {key: anxiety,                 options: [], fmt: "float:3"}
      - {key: awe,                     options: [], fmt: "float:3"}
      - {key: awkwardness,             options: [], fmt: "float:3"}
      - {key: boredom,                 options: [], fmt: "float:3"}
      - {key: calmness,                options: [], fmt: "float:3"}
      - {key: confusion,               options: [], fmt: "float:3"}
      - {key: contempt,                options: [], fmt: "float:3"}
      - {key: craving,                 options: [], fmt: "float:3"}
      - {key: disappointment,          options: [], fmt: "float:3"}
      - {key: disgust,                 options: [], fmt: "float:3"}
      - {key: empathic_pain,           options: [], fmt: "float:3"}
      - {key: entrancement,            options: [], fmt: "float:3"}
      - {key: envy,                    options: [], fmt: "float:3"}
      - {key: excitement,              options: [], fmt: "float:3"}
      - {key: fear,                    options: [], fmt: "float:3"}
      - {key: guilt,                   options: [], fmt: "float:3"}
      - {key: horror,                  options: [], fmt: "float:3"}
      - {key: interest,                options: [], fmt: "float:3"}
      - {key: joy,                     options: [], fmt: "float:3"}
      - {key: liberation,              options: [], fmt: "float:3"}
      - {key: nostalgia,               options: [], fmt: "float:3"}
      - {key: pride,                   options: [], fmt: "float:3"}
      - {key: relief,                  options: [], fmt: "float:3"}
      - {key: romance,                 options: [], fmt: "float:3"}
      - {key: sadness,                 options: [], fmt: "float:3"}
      - {key: satisfaction,            options: [], fmt: "float:3"}
      - {key: surprise,                options: [], fmt: "float:3"}
      - {key: sympathy,                options: [], fmt: "float:3"}
      - {key: triumph,                 options: [], fmt: "float:3"}

role_config:
  cat34_full_regression: {p_target: 1.00, p_context: 0.00}

role_rules:
  min_targets: 1
  force_target_if_present: []
  query_only_targets: false
  min_vars_for_dynamic_roles: 2

modality_map:
  sMRI: "structural MRI (T1-weighted MRI)"
  dMRI: "diffusion MRI (Fractional Anisotropic map)"
  fMRI: "functional MRI (4D BOLD volume)"
  ROI_fMRI: "ROI-based functional MRI (Schaefer-400 + Tian-S3-50 parcellated BOLD time-series during emotional video viewing)"

templates:
  - template_id: emotion_v1

    intro: "<Clinical_Task>\nYou are an expert AI affective neuroscientist. Analyze the provided fMRI data and predict the precise crowdsourced score (0-1) for each of the 34 emotion categories of the video stimulus.</Clinical_Task>\n\n"

    question:
      wrapper: "<Question>\n{body} **You MUST structure your response strictly using the {tags} XML tags.**\n</Question>"
      ask_phrase:
        cat34_full_regression: "the precise crowdsourced score (range 0-1) for each of the 34 emotion categories of the emotional video stimulus they were viewing"
      clause: {}
      reference: "Analyze the ROI-based fMRI time-series of {label}, focusing on parcel-level BOLD modulation during emotional video viewing. Predict {ask_phrase}."
      query: "Based on the two reference subjects analyzed previously, analyze the ROI-based fMRI time-series of {label}. Predict {ask_phrase}.{clauses}"

    answer:
      answer_phrase:
        cat34_full_regression: "{block}"
      phrase_maps: {}
