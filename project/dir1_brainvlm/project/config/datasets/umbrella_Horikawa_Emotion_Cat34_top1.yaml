# ============================================================================
# UMBRELLA dataset defs — Horikawa Emotion Cat34 Top-1 (ROI_fMRI)
#
# Task. fMRI → 34 Cowen emotion 중 dominant 1 개 분류.
# Training stimuli = 전체 2185.
# 34-way classification (argmax of soft distribution).
# Cat34 stage 의 가장 단순 (top1). 후속 = top2 / full_distribution / full_regression.
# Output 형식.
#   <Cat34_Top1_Analysis>
#     <Dominant_Emotion>joy</Dominant_Emotion>
#   </Cat34_Top1_Analysis>
#
# Emotion name = Horikawa et al. 2020 supplementary Table 1 의 standard 34 emotion (snake_case).
# ============================================================================

variable_order: [cat34_top1]

variable_registry:
  cat34_top1:
    kind: categorical
    block: Cat34_Top1_Analysis
    unit: "Cowen & Keltner (2017) 34 emotion categories, dominant emotion (argmax of crowdsourced soft distribution)"
    facets:
      - key: dominant_emotion
        options: [admiration, adoration, aesthetic_appreciation, amusement, anger,
                  anxiety, awe, awkwardness, boredom, calmness,
                  confusion, contempt, craving, disappointment, disgust,
                  empathic_pain, entrancement, envy, excitement, fear,
                  guilt, horror, interest, joy, liberation,
                  nostalgia, pride, relief, romance, sadness,
                  satisfaction, surprise, sympathy, triumph]
        fmt: str

role_config:
  cat34_top1: {p_target: 1.00, p_context: 0.00}

role_rules:
  min_targets: 1
  force_target_if_present: []
  query_only_targets: false
  min_vars_for_dynamic_roles: 2

modality_map:
  sMRI: "structural MRI (T1-weighted MRI)"
  dMRI: "diffusion MRI (Fractional Anisotropic map)"
  fMRI: "functional MRI (4D BOLD volume)"
  ROI_fMRI: "ROI-based functional MRI (Schaefer-400 + Tian-S3-50 parcellated BOLD time-series during emotional video viewing)"

templates:
  - template_id: emotion_v1

    intro: "<Clinical_Task>\nYou are an expert AI affective neuroscientist. Analyze the provided fMRI data and identify the single most dominant emotion category of the video stimulus the subject was viewing.</Clinical_Task>\n\n"

    question:
      wrapper: "<Question>\n{body} **You MUST structure your response strictly using the {tags} XML tags.**\n</Question>"
      ask_phrase:
        cat34_top1: "the single most dominant emotion category (options: {options}) of the emotional video stimulus they were viewing"
      clause: {}
      reference: "Analyze the ROI-based fMRI time-series of {label}, focusing on parcel-level BOLD modulation during emotional video viewing. Predict {ask_phrase}."
      query: "Based on the two reference subjects analyzed previously, analyze the ROI-based fMRI time-series of {label}. Predict {ask_phrase}.{clauses}"

    answer:
      answer_phrase:
        cat34_top1: "{block}"
      phrase_maps: {}
