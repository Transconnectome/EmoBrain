# ============================================================================
# UMBRELLA REG-binary. Horikawa Emotion VA binary classification (ROI_fMRI).
# Qwen3-VL-2B-Instruct.
# Direct binary head variant — autoregressive token output 폐기 → BCE on (B, 2) logit.
# REG (regression) yaml 의 모든 trainer/dataset/model 옵션 보존.
# 차이:
#   - dataset.ROI_fMRI.target = ["va_binary"]   (regression 대신 binary categories)
#   - trainer.metric_for_best_model = "eval_avg_balacc"
# ============================================================================

wandb:
    API_KEY: "TODO_INSERT_USER_WANDB_KEY"

seed: 1234

dataset:
    train_size: 0.8
    val_size: 0.1
    test_size: 0.1
    add_context: False
    sMRI:
        target: []
        img_size: [96, 96, 96]
        study_sample: []
        meta_dir: []
        img_dir: []
    dMRI:
        target: []
        img_size: [96, 96, 96]
        study_sample: []
        meta_dir: []
        img_dir: []
    fMRI:
        target: []
        img_size: [97, 115, 97, 16]
        study_sample: []
        img_dir: []
        dataset_split_num: 1
        sequence_length: 16
        stride_between_seq: 1
        stride_within_seq: 1
        shuffle_time_sequence: False
        input_scaling_method: "znorm_minback"
        label_scaling_method: "standardization"
        dtype: "float16"
        limit_training_samples: Null
        limit_validation_samples: Null
        limit_test_samples: Null
        balanced_training_samples: False
        balanced_validation_samples: False
        balanced_test_samples: False
    ROI_fMRI:
        target: ["va_binary"]
        img_size: [450, 16]
        recording: "Horikawa_ROI_zscore"
        study_sample: ["Horikawa"]

model:
    hf_name: "Qwen/Qwen3-VL-2B-Instruct"
    sMRI:
        patch_size: [8, 8, 8]
    dMRI:
        patch_size: [8, 8, 8]
    fMRI:
        patch_size: [16, 16, 16, 4]
    ROI_fMRI:
        patch_size: [1, 8]
    # REG-binary: 2-layer MLP head 구조 자체는 REG (regression) 과 동일.
    # output (B, 2) 가 logit 으로 재해석되고 BCE 가 적용된다.
    # pool 전략은 REG 와 같은 의미. binary 라서 바뀌는 점 없음.
    regression_head:
        hidden: 256
        dropout: 0.1
        pool: "mean_brain_tokens"

trainer:
    max_epochs: 10
    learning_rate: 0.0001
    warmup_steps: 50
    weight_decay: 0.01
    per_device_batch_size: 4
    max_images_per_sample: 4
    gradient_accumulation_steps: 16
    gradient_checkpointing: True
    mixed_precision: "bf16"
    logging_steps: 50
    eval_steps: 500
    save_steps: 500
    ckpt_dir: Null
    resume_training: False
    metric_for_best_model: "eval_avg_balacc"
