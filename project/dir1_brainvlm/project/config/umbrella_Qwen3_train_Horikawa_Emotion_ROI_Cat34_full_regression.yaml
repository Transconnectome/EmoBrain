# ============================================================================
# UMBRELLA Training Configuration — Horikawa Emotion Cat34 full regression (ROI_fMRI)
# Qwen3-VL dynamic-role pipeline. Horikawa structured records + 우리 emotion-specific defs.
# Note. ADHD200_IQ model config 의 patch_embed / trainer 패턴 차용. ROI_fMRI 만 실 사용.
# ============================================================================

wandb:
    API_KEY: "TODO_INSERT_USER_WANDB_KEY"      # 사용자가 본인 wandb api key 로 교체. 또는 .sh 의 --no-wandb 플래그.

seed: 1234

dataset:
    train_size: 0.8
    val_size: 0.1
    test_size: 0.1
    add_context: False
    sMRI:
        target: []
        img_size: [96, 96, 96]
        study_sample: []
        meta_dir: []
        img_dir: []
    dMRI:
        target: []
        img_size: [96, 96, 96]
        study_sample: []
        meta_dir: []
        img_dir: []
    fMRI:                                       # 4D voxel (보류, ROI_fMRI 만 사용)
        target: []
        img_size: [97, 115, 97, 16]
        study_sample: []
        img_dir: []
        dataset_split_num: 1
        sequence_length: 16
        stride_between_seq: 1
        stride_within_seq: 1
        shuffle_time_sequence: False
        input_scaling_method: "znorm_minback"
        label_scaling_method: "standardization"
        dtype: "float16"
        limit_training_samples: Null
        limit_validation_samples: Null
        limit_test_samples: Null
        balanced_training_samples: False
        balanced_validation_samples: False
        balanced_test_samples: False
    ROI_fMRI:
        target: ["cat34_full_regression"]               # dataset_defs 의 variable_order 와 일치
        img_size: [450, 16]                     # [num_regions=450 Schaefer400+TianS3-50, T=16 zero-padded]
        recording: "Horikawa_ROI_zscore"        # 우리 adapter 의 ROI normalization scheme
        study_sample: ["Horikawa"]

model:
    hf_name: "Qwen/Qwen3-VL-2B-Instruct"
    sMRI:
        patch_size: [8, 8, 8]
    dMRI:
        patch_size: [8, 8, 8]
    fMRI:
        patch_size: [16, 16, 16, 4]
    ROI_fMRI:
        patch_size: [1, 8]                      # [region_patch=1, time_patch=8] → 한 region 의 16 TR 이 2 patch

trainer:
    max_epochs: 50
    learning_rate: 0.0005
    warmup_steps: 25
    weight_decay: 0.01
    per_device_batch_size: 4
    max_images_per_sample: 4                    # 3-round ICL = 3 fMRI 의 sample, safety margin 1
    gradient_accumulation_steps: 16
    gradient_checkpointing: True
    mixed_precision: "bf16"
    logging_steps: 20
    ckpt_dir: Null
    resume_training: False
