# ============================================================================
# UMBRELLA REG. Horikawa Emotion VA regression (ROI_fMRI). Qwen3-VL-2B-Instruct.
# Option B = autoregressive token output 폐기 → 2-layer MLP regression head 직접 부착.
# v2 yaml 의 모든 trainer/dataset/model 옵션 보존 + regression_head 블록 추가.
# ============================================================================

wandb:
    API_KEY: "TODO_INSERT_USER_WANDB_KEY"

seed: 1234

dataset:
    train_size: 0.8
    val_size: 0.1
    test_size: 0.1
    add_context: False
    sMRI:
        target: []
        img_size: [96, 96, 96]
        study_sample: []
        meta_dir: []
        img_dir: []
    dMRI:
        target: []
        img_size: [96, 96, 96]
        study_sample: []
        meta_dir: []
        img_dir: []
    fMRI:
        target: []
        img_size: [97, 115, 97, 16]
        study_sample: []
        img_dir: []
        dataset_split_num: 1
        sequence_length: 16
        stride_between_seq: 1
        stride_within_seq: 1
        shuffle_time_sequence: False
        input_scaling_method: "znorm_minback"
        label_scaling_method: "standardization"
        dtype: "float16"
        limit_training_samples: Null
        limit_validation_samples: Null
        limit_test_samples: Null
        balanced_training_samples: False
        balanced_validation_samples: False
        balanced_test_samples: False
    ROI_fMRI:
        target: ["va_regression"]
        img_size: [450, 16]
        recording: "Horikawa_ROI_zscore"
        study_sample: ["Horikawa"]

model:
    hf_name: "Qwen/Qwen3-VL-2B-Instruct"
    sMRI:
        patch_size: [8, 8, 8]
    dMRI:
        patch_size: [8, 8, 8]
    fMRI:
        patch_size: [16, 16, 16, 4]
    ROI_fMRI:
        patch_size: [1, 8]
    # REG-specific: 2-layer MLP regression head 설정.
    # pool 전략:
    #   mean_brain_tokens (기본). query_C trial 의 brain image token 평균 -> MLP.
    #                              decoding 의 본질 (brain signal -> V/A) 과 직접 정렬.
    #   last_query_token            attention_mask 의 마지막 non-pad 위치. baseline 비교 용.
    regression_head:
        hidden: 256
        dropout: 0.1
        pool: "mean_brain_tokens"

trainer:
    max_epochs: 10
    learning_rate: 0.0001
    warmup_steps: 50
    weight_decay: 0.01
    per_device_batch_size: 4
    max_images_per_sample: 4
    gradient_accumulation_steps: 16
    gradient_checkpointing: True
    mixed_precision: "bf16"
    logging_steps: 50
    eval_steps: 500
    save_steps: 500
    ckpt_dir: Null
    resume_training: False
    metric_for_best_model: "eval_task_0_v_pearson"
