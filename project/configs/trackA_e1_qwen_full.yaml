# Track A / E1 / Qwen FULL run. First real result vs ridge (0.30 / 0.17).
# Full train data, no batch cap. Run only after the gpusmoke config passes.
# OOM? drop batch_size 8 -> 4, or hf_model 3B -> Qwen/Qwen2.5-1.5B-Instruct.
encoder:
  name: e1_raw_roi
  roi_dim: 450
  hidden: 512
  out_dim: 512
projector:
  name: mlp
  n_tokens: 8
backbone:
  name: qwen
  hf_model: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]
head:
  name: linear34
modalities:
  brain: true
  video: false
  caption: false
data:
  fmri_mode: mean
train:
  device: cuda
  seed: 0
  epochs: 3
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 0.01
  max_train_batches: null     # full data (~1093 batches/epoch)
  max_eval_batches: null      # full val (1085)
  log_every: 100              # ~11 lines/epoch at batch 8
  out_json: project/output/train_trackA_e1_qwen_full.json
