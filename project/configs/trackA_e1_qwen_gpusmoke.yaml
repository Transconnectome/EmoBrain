# Track A / E1 / Qwen GPU SMOKE. First real-LLM run on GPU, kept tiny to
# validate the qwen path (load, forward, backward, no OOM) cheaply. Once this
# passes, remove max_train_batches and raise epochs/batch for the full run.
#
# Backbone = text-only Qwen decoder (Track A has no image/video). LoRA on
# attention projections; encoder + projector + head train in fp32, LLM base
# frozen except LoRA adapters.
encoder:
  name: e1_raw_roi
  roi_dim: 450
  hidden: 512
  out_dim: 512
projector:
  name: mlp
  n_tokens: 8
backbone:
  name: qwen
  hf_model: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]
head:
  name: linear34
modalities:
  brain: true
  video: false
  caption: false
data:
  fmri_mode: mean
train:
  device: cuda
  seed: 0
  epochs: 1
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 0.01
  max_train_batches: 50      # GPU smoke only. remove for the full run.
  max_eval_batches: 20
  log_every: 10              # print per-step loss to see the trajectory
  out_json: project/output/train_trackA_e1_qwen_gpusmoke.json
