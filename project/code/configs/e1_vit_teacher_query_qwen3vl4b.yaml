# B1 teacher. Same as e1_vit_teacher but the LLM ANSWERS the prompt: 34 emotion
# query tokens are appended after the "score each 0..1" instruction and each
# emotion's score is read from its contextualised state (readout: query), instead
# of a linear probe on a pooled token. This is the LLM-native design the prompt
# was written for. Its cache feeds the B1 student.
run: {name: e1_vit_teacher_query}
encoder:
  {type: vit, hf_model: google/vit-base-patch16-224, grid: 22, adapt: lora,
   lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05}}
projector: {type: mlp, n_tokens: 16}
video:
  {dim: 1408, type: mlp, n_tokens: 16,
   path: project/shared/data/stimulus_features/vjepa2_pretrained.npy}
backbone:
  {type: qwen, hf_model: Qwen/Qwen3-VL-4B-Instruct, dtype: bfloat16, frozen: true,
   lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05, target_modules: [q_proj, v_proj]}}
modalities: {brain: true, video: true, caption: true}
readout: {type: query}
data: {brain_source: roi_mean, caption_source: mindcaptioning_human}
loss: {hard_kind: mse, lambda_hard: 1.0}
train:
  {device: cuda, seed: 0, epochs: 20, batch_size: 8, lr: 1.0e-4, weight_decay: 0.01,
   teacher_ckpt: project/output/checkpoints/e1_vit_teacher_query_qwen3vl4b.pt,
   out_json: project/output/e1_vit_teacher_query_qwen3vl4b.json}
