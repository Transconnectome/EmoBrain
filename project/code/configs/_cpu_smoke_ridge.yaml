# CPU wiring smoke. ridge baseline through the stub backbone, brain-only student.
encoder: {type: ridge, adapt: frozen}
projector: {type: mlp, n_tokens: 8}
backbone: {type: stub, hidden_dim: 128}
head: {name: linear34}
modalities: {brain: true, video: false, caption: false}
data: {brain_source: roi_mean}
loss: {lambda_hard: 1.0}
train: {device: cpu, seed: 0, epochs: 1, batch_size: 8, lr: 1.0e-3,
        max_train_batches: 5, max_eval_batches: 3, out_json: project/output/cpu_smoke_ridge.json}
