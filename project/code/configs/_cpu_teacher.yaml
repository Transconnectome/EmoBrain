run: {name: cpu_teacher}
encoder: {type: ridge, adapt: frozen}
projector: {type: mlp, n_tokens: 8}
video: {dim: 1408, n_tokens: 8, path: project/shared/data/stimulus_features/vjepa2_pretrained.npy}
backbone: {type: stub, hidden_dim: 128}
head: {name: linear34}
modalities: {brain: true, video: true, caption: true}
