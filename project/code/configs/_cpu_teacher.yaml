loss: {lambda_hard: 1.0}
train: {device: cpu, seed: 0, epochs: 1, batch_size: 8, lr: 1.0e-3,
        max_train_batches: 5, max_eval_batches: 3,
        teacher_ckpt: project/output/checkpoints/cpu_teacher.pt}
