# Encoder 1 = ViT (image-pretrained, fMRI-as-image), LoRA-adapted, brain-only student.
encoder: {type: vit, hf_model: google/vit-base-patch16-224, grid: 22, adapt: lora,
          lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05}}
projector: {type: mlp, n_tokens: 16}
backbone: {type: qwen, hf_model: Qwen/Qwen3-VL-4B-Instruct, dtype: bfloat16, frozen: true,
           lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05, target_modules: [q_proj, v_proj]}}
head: {name: linear34}
modalities: {brain: true, video: false, caption: false}
data: {brain_source: roi_mean}
loss: {lambda_hard: 1.0}
train: {device: cuda, seed: 0, epochs: 8, batch_size: 8, lr: 1.0e-4, weight_decay: 0.01,
        out_json: project/output/vit_lora_student_qwen.json}
