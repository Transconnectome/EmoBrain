run: {name: ridge_teacher}
# Teacher = brain + video (V-JEPA2) + caption, ridge brain encoder, Qwen3-VL.
encoder: {type: ridge, adapt: frozen}
projector: {type: mlp, n_tokens: 16}
video: {dim: 1408, n_tokens: 16, path: project/shared/data/stimulus_features/vjepa2_pretrained.npy}
backbone: {type: qwen, hf_model: Qwen/Qwen3-VL-4B-Instruct, dtype: bfloat16, frozen: true,
           lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05, target_modules: [q_proj, v_proj]}}
head: {name: linear34}
modalities: {brain: true, video: true, caption: true}
data: {brain_source: roi_mean}
loss: {lambda_hard: 1.0}
train: {device: cuda, seed: 0, epochs: 8, batch_size: 8, lr: 1.0e-4, weight_decay: 0.01,
        teacher_ckpt: project/output/checkpoints/ridge_teacher.pt}
