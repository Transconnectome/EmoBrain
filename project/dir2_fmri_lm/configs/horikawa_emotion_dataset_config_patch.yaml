## EmoBrain D2 dataset additions.
## fMRI-LM official `configs/dataset_config.yaml` 와 merge 해서 사용한다.
##
## 협업자가 새 dataset 추가할 때 이 파일에 entry 만 추가하고,
## `code/adapters/<dataset>.py` 로 HDF5 + descriptors 를 만들어 두면
## launch script 의 --dataset_dir 에 path 만 더하면 된다.
##
## entry 형식은 official 와 동일 (datasets/<NAME>/targets).
## emotion task 는 targets 가 임상 label 이 아니라 emotion-specific 이름.

datasets:
  Horikawa:
    targets:
      - valence_continuous     # V_reg
      - arousal_continuous     # A_reg
      - valence_binary         # V_binary (Q1 vs Q4)
      - arousal_binary         # A_binary (Q1 vs Q4)
      - cat34_multilabel       # threshold 0.10
      - cat34_soft             # 34-D soft distribution
    desc_types:
      - va           # valence/arousal continuous values in natural language
      - va_binary    # valence/arousal Q1 vs Q4 labels in natural language
      - cat_top1
      - cat_topk     # threshold 0.10
    cohort_info: "Naturalistic video fMRI from Horikawa et al. (5 subjects, 2185 stimuli)."
  EmoFilM:
    targets: []      # 다운로드 + label schema 결정 후 채울 것
    desc_types: []
    cohort_info: "TBD — narratives + temporal dynamics 강조 dataset."
